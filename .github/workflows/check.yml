name: check
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get list of changed files
        id: files
        shell: bash
        run: |
          git fetch origin master:master
          git diff --diff-filter=ACMRT --name-only -z master -- streams/ > "$RUNNER_TEMP/changed-files"
          if [ -s "$RUNNER_TEMP/changed-files" ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.files.outputs.any_changed == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.files.outputs.any_changed == 'true'
        run: npm ci --ignore-scripts
      - name: Validate changed files
        if: steps.files.outputs.any_changed == 'true'
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            npm run playlist:lint -- "$file"
            npm run playlist:validate -- --log-level=error "$file"
          done < "$RUNNER_TEMP/changed-files"
